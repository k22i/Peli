# #11: frontend lint, type check, tests and build. The CI workflow in #16
# folds these steps into its OS matrix; remove this file then.
name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "**/*.go"
      - go.mod
      - go.sum
      - .github/workflows/frontend.yml
  pull_request:
    paths:
      - "frontend/**"
      - "**/*.go"
      - go.mod
      - go.sum
      - .github/workflows/frontend.yml
  workflow_dispatch:

env:
  WAILS3: github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      # Generating bindings loads the Wails packages, whose Linux cgo files
      # need the GTK and WebKitGTK headers.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go install "$WAILS3"
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          working-directory: frontend
          node-version: "24"
          cache: true
      - run: vp run bindings
      - run: vp fmt --check
      - run: vp run lint
      - run: vp run typecheck
      - run: vp run test
      - run: vp run build
