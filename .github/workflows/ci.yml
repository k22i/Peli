# #16: lint, test and build Peli on Windows, macOS and Linux: the newest
# runner image of each, x64 except macOS (arm64). No Intel Mac and no older
# images: a macOS minute costs ten on a private repo.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "spikes/**"
      - "**/*.md"
      - ".github/workflows/spike-*.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "spikes/**"
      - "**/*.md"
      - ".github/workflows/spike-*.yml"
  workflow_dispatch:
    inputs:
      dev-smoke:
        description: Also check that `wails3 dev` starts the app (Windows, Linux)
        type: boolean
        default: false
      contract:
        description: Also run the Nuvio contract tests against self-host (#33)
        type: boolean
        default: false
  # #33: the Nuvio contract tests, daily. Only the contract job runs.
  schedule:
    - cron: "23 5 * * *"

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.x"
  NODE_VERSION: "26"
  WAILS3: github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
  # The Wails packages' Linux cgo files need the GTK and WebKitGTK headers,
  # and the player (#60) libmpv's and libepoxy's.
  LINUX_DEPS: build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libmpv-dev libepoxy-dev
  # Ubuntu 26.04's mpv.pc passes -fno-strict-overflow, which cgo refuses
  # unless allowed (https://go.dev/s/invalidflag).
  CGO_CFLAGS_ALLOW: -fno-strict-overflow
  # #92: macOS builds with our own LGPL libmpv (libmpv.yml). TODO(#92):
  # Windows still links shinchiro's (the M0 spikes' build) until our Windows
  # build lands; Linux links the distro's, which the .deb depends on anyway
  # (AppImage and Flatpak are deferred, #103).
  LIBMPV_WIN_TAG: "20261009"
  LIBMPV_WIN_ASSET: mpv-dev-x86_64-20261009-git-36abaa32d0.7z

jobs:
  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - run: go install "$WAILS3"
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          working-directory: frontend
          node-version: ${{ env.NODE_VERSION }}
          cache: true
      - run: vp run bindings
      - run: vp fmt --check
      - run: vp run lint
      - run: vp run typecheck
      - run: vp run test
      - run: vp run build

  # #18: the notices match the dependencies, and nothing in them is GPL-only.
  licences:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          npm install -g "$(node -p "require('./package.json').packageManager")"
          pnpm install --frozen-lockfile
        working-directory: frontend
      # The root package embeds frontend/dist, which `go list` needs to exist.
      - run: mkdir -p frontend/dist && touch frontend/dist/.keep
      # Only the notices tool has tests. The others import Wails, whose Linux
      # cgo needs GTK headers this job skips; the go job vets ./tools/... on
      # every OS.
      - run: go test ./tools/notices
      - run: go run ./tools/notices
      - name: Notices are up to date
        run: git diff --exit-code THIRD_PARTY_NOTICES.md internal/licences/notices.json
      - run: go run ./tools/notices -audit

  libmpv:
    if: github.event_name != 'schedule'
    # A called workflow's jobs may not ask for more than the caller grants,
    # and libmpv.yml's publish job (manual runs only, never from here) asks
    # for contents: write. Its build job drops back to read.
    permissions:
      contents: write
    uses: ./.github/workflows/libmpv.yml

  go:
    if: github.event_name != 'schedule'
    needs: libmpv
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      # #92: our own LGPL libmpv, from the libmpv job.
      - if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: libmpv-macos-arm64
          path: ${{ runner.temp }}/libmpv
      - if: runner.os == 'macOS'
        run: |
          tar -C "$RUNNER_TEMP/libmpv" -xJf "$RUNNER_TEMP"/libmpv/libmpv-macos-*.tar.xz
          echo "PKG_CONFIG_PATH=$(echo "$RUNNER_TEMP"/libmpv/libmpv-macos-*/lib/pkgconfig)" >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        name: Fetch libmpv
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$LIBMPV_WIN_TAG" --repo shinchiro/mpv-winbuild-cmake -p "$LIBMPV_WIN_ASSET" -D "$RUNNER_TEMP"
          7z x -y -o"$RUNNER_TEMP/libmpv" "$RUNNER_TEMP/$LIBMPV_WIN_ASSET" > /dev/null
          lib=$(cygpath -m "$RUNNER_TEMP/libmpv")
          { echo "CGO_ENABLED=1"; echo "CGO_CFLAGS=-I$lib/include"; echo "CGO_LDFLAGS=-L$lib"; } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/libmpv" >> "$GITHUB_PATH"
      # Windows checks out with CRLF line endings, which gofmt flags.
      - if: runner.os != 'Windows'
        run: test -z "$(gofmt -l main.go internal)" || { gofmt -l main.go internal; exit 1; }
      - run: go vet ./internal/... ./tools/...
      # No race detector on Windows: it had no cgo there until libmpv (#60),
      # and turning it on is a change of its own.
      - run: go test ${{ runner.os != 'Windows' && '-race' || '' }} ./internal/...
      # The store's bbolt file locking and mmap differ per OS: keep its
      # benchmark (Home's data load) running everywhere.
      - run: go test -run '^$' -bench . -benchtime 20x ./internal/store
      # #15: secrets against the real OS keychain. On Linux that means a
      # Secret Service: gnome-keyring on a throwaway session bus.
      - if: runner.os != 'Linux'
        run: PELI_KEYCHAIN_TEST=1 go test -v -run 'OSKeychain|NoTokens' ./internal/secrets
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus
          dbus-run-session -- bash -c "echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null && PELI_KEYCHAIN_TEST=1 go test -v -run 'OSKeychain|NoTokens' ./internal/secrets"
      # A session bus with no service directories: nothing can provide
      # org.freedesktop.secrets, so Peli must give the clear error.
      - if: runner.os == 'Linux'
        run: |
          cat > "$RUNNER_TEMP/bare-bus.conf" <<'EOF'
          <busconfig>
            <type>session</type>
            <listen>unix:tmpdir=/tmp</listen>
            <policy context="default">
              <allow send_destination="*" eavesdrop="true"/>
              <allow eavesdrop="true"/>
              <allow own="*"/>
            </policy>
          </busconfig>
          EOF
          dbus-run-session --config-file="$RUNNER_TEMP/bare-bus.conf" -- env PELI_KEYCHAIN_TEST=unavailable go test -v -run OSKeychainUnavailable ./internal/secrets

  build:
    if: github.event_name != 'schedule'
    needs: libmpv
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, name: windows-amd64, arch: amd64 }
          - { os: macos-26, name: macos-arm64, arch: arm64 }
          - { os: ubuntu-26.04, name: linux-amd64, arch: amd64 }
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Install the pinned pnpm directly: pnpm/action-setup installs the latest
      # and switches, which fails its binary identity check on Intel Macs.
      - run: |
          npm install -g "$(node -p "require('./frontend/package.json').packageManager")"
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - run: go install "$WAILS3"
      # #92: our own LGPL libmpv, from the libmpv job.
      - if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: libmpv-macos-arm64
          path: ${{ runner.temp }}/libmpv
      - if: runner.os == 'macOS'
        run: |
          tar -C "$RUNNER_TEMP/libmpv" -xJf "$RUNNER_TEMP"/libmpv/libmpv-macos-*.tar.xz
          echo "PKG_CONFIG_PATH=$(echo "$RUNNER_TEMP"/libmpv/libmpv-macos-*/lib/pkgconfig)" >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        name: Fetch libmpv
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$LIBMPV_WIN_TAG" --repo shinchiro/mpv-winbuild-cmake -p "$LIBMPV_WIN_ASSET" -D "$RUNNER_TEMP"
          7z x -y -o"$RUNNER_TEMP/libmpv" "$RUNNER_TEMP/$LIBMPV_WIN_ASSET" > /dev/null
          lib=$(cygpath -m "$RUNNER_TEMP/libmpv")
          { echo "CGO_ENABLED=1"; echo "CGO_CFLAGS=-I$lib/include"; echo "CGO_LDFLAGS=-L$lib"; } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/libmpv" >> "$GITHUB_PATH"
      - if: runner.os != 'macOS'
        run: wails3 build
      # Builds the binary, wraps it in Peli.app (signed ad hoc, hardened
      # runtime) and that in the drag-to-Applications DMG, failing over 60 MB
      # (#78). The signed, notarized release for both architectures is
      # release.yml (#80), on a tag.
      - if: runner.os == 'macOS'
        run: wails3 task darwin:package:dmg
      # The build runs `go mod tidy`: a change means go.mod or go.sum is stale.
      - run: git diff --exit-code go.mod go.sum
      # #18: no GPL-only or non-free libmpv/FFmpeg in what we ship.
      - run: go run ./tools/notices -audit -bundle bin
      - name: Check the binary's target
        run: |
          bin=bin/peli
          [ "$RUNNER_OS" = Windows ] && bin=bin/peli.exe
          [ "$RUNNER_OS" = macOS ] && bin=bin/Peli.app/Contents/MacOS/peli
          go version -m "$bin" | tee buildinfo.txt
          grep -Eq "GOARCH=${{ matrix.arch }}$" buildinfo.txt
          grep -Eq -- "-tags=production" buildinfo.txt
          # No SQLite from anacrolix/torrent (#55, ADR-0040).
          grep -Eq -- "-tags=production,nosqlite" buildinfo.txt
          ! grep -q go-llsqlite buildinfo.txt
          ls -l bin
      # #92, #78: the bundle carries our libmpv for its architecture, loads it
      # from there and links nothing else outside the system.
      - if: runner.os == 'macOS'
        run: build/darwin/dist.sh check bin/Peli.app ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: peli-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: error
          path: |
            bin/peli.exe
            bin/Peli-*.dmg
            ${{ runner.os == 'Linux' && 'bin/peli' || '' }}

  # Manual only: checks that `wails3 dev` starts the app (was #10's
  # scaffold-check; macOS is checked locally).
  dev-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.dev-smoke
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS xvfb xauth dbus-x11
          # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor,
          # which WebKitGTK's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: runner.os == 'Windows'
        name: Fetch libmpv
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$LIBMPV_WIN_TAG" --repo shinchiro/mpv-winbuild-cmake -p "$LIBMPV_WIN_ASSET" -D "$RUNNER_TEMP"
          7z x -y -o"$RUNNER_TEMP/libmpv" "$RUNNER_TEMP/$LIBMPV_WIN_ASSET" > /dev/null
          lib=$(cygpath -m "$RUNNER_TEMP/libmpv")
          { echo "CGO_ENABLED=1"; echo "CGO_CFLAGS=-I$lib/include"; echo "CGO_LDFLAGS=-L$lib"; } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/libmpv" >> "$GITHUB_PATH"
      - run: go install "$WAILS3"
      # Start `wails3 dev`, wait for the Vite server and the app, and check the
      # app is still running 15 s later.
      - name: wails3 dev
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a wails3 dev > dev.log 2>&1 &
            running() { pgrep -f 'bin/peli' > /dev/null; }
          else
            wails3 dev > dev.log 2>&1 &
            running() { tasklist //FI "IMAGENAME eq peli.exe" | grep -q peli.exe; }
          fi
          for i in $(seq 1 90); do
            if running && curl -sf -o /dev/null http://127.0.0.1:9245/; then break; fi
            sleep 2
          done
          running && curl -sf http://127.0.0.1:9245/ | grep '<title>Peli</title>'
          sleep 15
          running
          echo "app running under wails3 dev"
      - if: always()
        run: cat dev.log || true

  # #33: the contract and integration tests against a self-hosted Nuvio at a
  # pinned commit (ADR-0020), daily and on demand. A failure means the
  # backend changed shape or behavior: docs/nuvio-release-checklist.md says
  # what to do. The same tests run against nuviotest's fake in the go job.
  contract:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.contract)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Bump with docs/nuvio-release-checklist.md.
      NUVIO_SELF_HOST_REF: 30f156807ae77b2aec80b091b0d513841a25ab91
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NuvioMedia/self-host
          ref: ${{ env.NUVIO_SELF_HOST_REF }}
          path: self-host
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - name: Start self-host
        working-directory: self-host
        run: |
          ./nuvio setup --no-import-account
          ./nuvio up
      - run: mkdir -p frontend/dist && touch frontend/dist/.keep
      - name: Contract and integration tests
        env:
          PELI_CONTRACT_URL: http://localhost:8000
        run: go test -v -count=1 -run 'TestContract|TestProgressReachesAnotherDevice' ./internal/nuvio ./internal/syncer
      - if: failure()
        working-directory: self-host
        run: docker compose logs --tail 200
      - if: always()
        working-directory: self-host
        run: docker compose down --volumes || true
