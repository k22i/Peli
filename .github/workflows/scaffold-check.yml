# #10: checks that `wails3 build` and `wails3 dev` work on Windows and Linux
# (macOS is checked locally). Superseded by the CI workflow in #16; remove it
# then.
name: scaffold-check

on:
  workflow_dispatch:

env:
  WAILS3: github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev xvfb xauth dbus-x11
          # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor,
          # which WebKitGTK's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: go install "$WAILS3"
      - run: wails3 build
      - run: ls -l bin
      # Start `wails3 dev`, wait for the Vite server and the app, and check the
      # app is still running 15 s later.
      - name: wails3 dev
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a wails3 dev > dev.log 2>&1 &
            running() { pgrep -f 'bin/cove' > /dev/null; }
          else
            wails3 dev > dev.log 2>&1 &
            running() { tasklist //FI "IMAGENAME eq cove.exe" | grep -q cove.exe; }
          fi
          for i in $(seq 1 90); do
            if running && curl -sf -o /dev/null http://127.0.0.1:9245/; then break; fi
            sleep 2
          done
          running && curl -sf http://127.0.0.1:9245/ | grep '<title>Cove</title>'
          sleep 15
          running
          echo "app running under wails3 dev"
      - if: always()
        run: cat dev.log || true
