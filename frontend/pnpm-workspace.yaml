# Refuse to install package versions published less than 7 days (10080
# minutes) ago, reducing exposure to freshly compromised or malicious releases.
minimumReleaseAge: 10080
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
