# Headless sway for the spike: one 1600x900 output, the app floating at 0,0
# at its own size (Wails asks for 1280x720), no borders.
output HEADLESS-1 resolution 1600x900 position 0 0 bg #303030 solid_color
default_border none
default_floating_border none
for_window [title="Peli spike.*"] floating enable, move position 0 0
seat seat0 hide_cursor 0
xwayland disable
