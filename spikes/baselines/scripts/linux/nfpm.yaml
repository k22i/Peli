# The app's build/linux/nfpm/nfpm.yaml, plus libmpv2 for the mpv build.
# ${SINAG_*} are filled in by package.sh (nfpm doesn't expand them in contents).
name: "sinag"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: "k22i <noreply@example.com>"
description: "Sinag baseline spike"
vendor: "k22i"
license: "MIT"
release: "1"
contents:
  - src: "${SINAG_BIN}"
    dst: "/usr/local/bin/sinag"
  - src: "../../build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/sinag.png"
  - src: "scripts/linux/sinag.desktop"
    dst: "/usr/share/applications/sinag.desktop"
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - ${SINAG_MPV_DEP}
