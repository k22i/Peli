# The app's build/linux/nfpm/nfpm.yaml, plus libmpv2 for the mpv build.
# ${PELI_*} are filled in by package.sh (nfpm doesn't expand them in contents).
name: "peli"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: "k22i <noreply@example.com>"
description: "Peli baseline spike"
vendor: "k22i"
license: "MIT"
release: "1"
contents:
  - src: "${PELI_BIN}"
    dst: "/usr/local/bin/peli"
  - src: "../../build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/peli.png"
  - src: "scripts/linux/peli.desktop"
    dst: "/usr/share/applications/peli.desktop"
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - ${PELI_MPV_DEP}
