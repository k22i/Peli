<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- Peli's iOS app icon, tinted appearance (iOS 18+): a grayscale mark the system colours. A full-bleed square with no shadow or corners: iOS masks it,
     and an App Store icon has no transparency. Rendered to a 1024 px PNG with headless Chrome (see ios/README.md). -->
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#000"/></linearGradient>
 <radialGradient id="bgshine" cx=".3" cy=".1" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <filter id="tile" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
 <linearGradient id="cream" gradientUnits="userSpaceOnUse" x1="14" y1="6" x2="48" y2="56">
  <stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#f2f2f2"/><stop offset="1" stop-color="#d8d8d8"/></linearGradient>
 <radialGradient id="shine" gradientUnits="userSpaceOnUse" cx="20" cy="11" r="22">
  <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <filter id="shade" x="-20%" y="-20%" width="140%" height="140%">
  <feOffset dy="-1.6"/><feGaussianBlur stdDeviation="1.6" result="o"/>
  <feComposite in="SourceAlpha" in2="o" operator="out" result="edge"/>
  <feFlood flood-color="#000" flood-opacity=".35"/><feComposite in2="edge" operator="in"/></filter>
 <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
  <feDropShadow dx="0" dy="2.2" stdDeviation="2" flood-color="#000" flood-opacity=".5"/></filter>
 <clipPath id="body"><path d="M11 24V47Q11 55 18.5 52.4L53 38.6C57.6 36.8 59.6 33.4 57.6 30.4C56.6 28.8 55 28.2 53 27.4L30 14Z"/><circle cx="22.5" cy="18.5" r="11.5"/><circle cx="11.2" cy="27" r="4.2"/><circle cx="11.2" cy="34.5" r="4"/><circle cx="11.2" cy="42" r="3.6"/><path d="M14 11.5C9 9.5 6.5 12.5 7 16C9 14 11.5 14 13 15.5Z"/><path d="M17 8.4C14 4.5 9.6 5.2 8.6 8.4C11.2 7.6 13.6 8.6 14.6 10.6Z"/></clipPath>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<g transform="translate(512 524) scale(11.4) translate(-31.6 -29.5)">
 <g filter="url(#lift)"><g fill="url(#cream)"><path d="M11 24V47Q11 55 18.5 52.4L53 38.6C57.6 36.8 59.6 33.4 57.6 30.4C56.6 28.8 55 28.2 53 27.4L30 14Z"/><circle cx="22.5" cy="18.5" r="11.5"/><circle cx="11.2" cy="27" r="4.2"/><circle cx="11.2" cy="34.5" r="4"/><circle cx="11.2" cy="42" r="3.6"/><path d="M14 11.5C9 9.5 6.5 12.5 7 16C9 14 11.5 14 13 15.5Z"/><path d="M17 8.4C14 4.5 9.6 5.2 8.6 8.4C11.2 7.6 13.6 8.6 14.6 10.6Z"/></g></g>
 <g clip-path="url(#body)"><rect width="64" height="64" fill="url(#shine)"/><g filter="url(#shade)"><path d="M11 24V47Q11 55 18.5 52.4L53 38.6C57.6 36.8 59.6 33.4 57.6 30.4C56.6 28.8 55 28.2 53 27.4L30 14Z"/><circle cx="22.5" cy="18.5" r="11.5"/><circle cx="11.2" cy="27" r="4.2"/><circle cx="11.2" cy="34.5" r="4"/><circle cx="11.2" cy="42" r="3.6"/><path d="M14 11.5C9 9.5 6.5 12.5 7 16C9 14 11.5 14 13 15.5Z"/><path d="M17 8.4C14 4.5 9.6 5.2 8.6 8.4C11.2 7.6 13.6 8.6 14.6 10.6Z"/></g></g>
 <g fill="#111"><rect x="22.6" y="13.2" width="4" height="7.4" rx="2"/></g><g stroke="#111"><path d="M32.5 24.8C40 27.6 46 30.4 51 32.6" fill="none" stroke-width="2.6" stroke-linecap="round"/></g>
 <rect x="23.6" y="14.2" width="1.3" height="2.4" rx=".65" fill="#fff" opacity=".7"/>
</g>
</svg>
