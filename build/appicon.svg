<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- Peli's app icon. Rendered to appicon.png at 1024 px; the .icon bundle
     (Icon Composer, macOS 26) is built from the same shapes. -->
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#ffcf7a"/><stop offset=".6" stop-color="#f39a22"/><stop offset="1" stop-color="#e2700f"/></linearGradient>
 <radialGradient id="bgshine" cx=".3" cy=".1" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <filter id="tile" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
 <linearGradient id="cream" gradientUnits="userSpaceOnUse" x1="14" y1="6" x2="48" y2="56">
  <stop offset="0" stop-color="#fffdf8"/><stop offset=".55" stop-color="#fff1d9"/><stop offset="1" stop-color="#ffd9a3"/></linearGradient>
 <radialGradient id="shine" gradientUnits="userSpaceOnUse" cx="20" cy="11" r="22">
  <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <filter id="shade" x="-20%" y="-20%" width="140%" height="140%">
