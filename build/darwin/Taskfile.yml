version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Docker image for cross-compilation (used when building on non-macOS)
  CROSS_IMAGE: wails-cross
  # The bundle is named for Finder ("Peli" in Applications); the executable
  # inside it keeps APP_NAME.
  BUNDLE: '{{.BIN_DIR}}/Peli.app'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: '{{if eq OS "darwin"}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'

  build:native:
    summary: Builds the application natively on macOS
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - wails3 tool prepare-macos-output --dir "{{.BIN_DIR}}"
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"'
    vars:
      # Info.plist's version, which updates compare (#83). Before BUILD_FLAGS,
      # which uses it: Task reads vars in order. A dev build stays 0.0.0-dev
      # and never updates.
      VERSION:
        sh: /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/darwin/Info.plist
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production,nosqlite{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -X github.com/k22i/Peli/internal/appinfo.Version={{.VERSION}}"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      # mpv's cflags name the libmpv the build uses. Go's cache key includes
      # CGO_CFLAGS but not PKG_CONFIG_PATH, so without them a build after
      # switching libmpv (Homebrew's, ours, the other arch's) keeps linking
      # the old one.
      CGO_CFLAGS:
        sh: echo "-mmacosx-version-min=12.0 $(pkg-config --cflags mpv 2>/dev/null)"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"

  build:docker:
    summary: Cross-compiles for macOS using Docker (for Linux/Windows hosts)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} {{.CROSS_IMAGE}} darwin {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - mkdir -p {{.BIN_DIR}}
      - mv "bin/{{.APP_NAME}}-darwin-{{.DOCKER_ARCH}}" "{{.OUTPUT}}"
    vars:
      DOCKER_ARCH: '{{if eq .ARCH "arm64"}}arm64{{else if eq .ARCH "amd64"}}amd64{{else}}arm64{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Generate Docker volume mounts: Go module cache + go.mod replace directives
      # Uses wails3 tool docker-mounts for cross-platform compatibility (Windows/Linux/macOS)
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'

  package:
    summary: Packages the application into a signed `Peli.app` bundle
    deps:
      - task: build
    cmds:
      - task: create:app:bundle

  package:dmg:
    summary: Packages Peli.app into bin/Peli-<version>-<arch>.dmg (unnotarized)
    desc: |
      The drag-to-Applications disk image, for one architecture. Signed ad hoc
      unless PELI_SIGN_IDENTITY names a Developer ID; `release` also notarizes.
    deps:
      - task: package
    cmds:
      - build/darwin/dist.sh check "{{.BUNDLE}}" "{{.ARCH | default ARCH}}"
      - build/darwin/dist.sh dmg "{{.BUNDLE}}" "{{.ARCH | default ARCH}}"

  package:zip:
    summary: Packages Peli.app into bin/Peli-<version>-<arch>.zip, the update (unnotarized)
    desc: |
      What installed copies update from (#83, ADR-0054). `release` makes it
      from the notarized app; this one is for trying an update locally.
    deps:
      - task: package
    cmds:
      - build/darwin/dist.sh check "{{.BUNDLE}}" "{{.ARCH | default ARCH}}"
      - build/darwin/dist.sh zip "{{.BUNDLE}}" "{{.ARCH | default ARCH}}"

  release:
    summary: Builds, signs and notarizes the DMG for one architecture (ARCH=arm64|amd64)
    desc: |
      #78, ADR-0053. Builds against Peli's own libmpv for ARCH (from
      build/libmpv/.work, or LIBMPV=<unpacked build>), signs with
      PELI_SIGN_IDENTITY, notarizes and staples the app, zips it for updates
      (#83), then makes and notarizes the DMG.
      Credentials: see build/darwin/dist.sh. Run once per architecture:

        wails3 task darwin:release ARCH=arm64
        wails3 task darwin:release ARCH=amd64
    platforms: [darwin]
    requires:
      vars: [ARCH]
    preconditions:
      - sh: '[ -n "${PELI_SIGN_IDENTITY:-}" ] && [ "$PELI_SIGN_IDENTITY" != - ]'
        msg: "Set PELI_SIGN_IDENTITY to the Developer ID Application certificate (security find-identity -v -p codesigning)"
      - sh: test -f "{{.LIBMPV}}/lib/pkgconfig/mpv.pc"
        msg: "No libmpv at {{.LIBMPV}}: run build/libmpv/build.sh macos-{{.TARGET}}, or pass LIBMPV=<dir>"
    cmds:
      - PKG_CONFIG_PATH="{{.LIBMPV}}/lib/pkgconfig" wails3 task darwin:package ARCH={{.ARCH}}
      - build/darwin/dist.sh check "{{.BUNDLE}}" {{.ARCH}}
      - build/darwin/dist.sh notarize "{{.BUNDLE}}"
      - build/darwin/dist.sh zip "{{.BUNDLE}}" {{.ARCH}}
      - build/darwin/dist.sh dmg "{{.BUNDLE}}" {{.ARCH}}
      - build/darwin/dist.sh notarize "{{.BIN_DIR}}/Peli-{{.VERSION}}-{{.TARGET}}.dmg"
    vars:
      TARGET: '{{if eq .ARCH "amd64"}}x86_64{{else}}arm64{{end}}'
      LIBMPV: '{{.LIBMPV | default (print .ROOT_DIR "/build/libmpv/.work/libmpv-macos-" .TARGET)}}'
      VERSION:
        sh: /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/darwin/Info.plist

  create:app:bundle:
    summary: Creates the signed `Peli.app` bundle
    cmds:
      # A reused bundle can acquire Finder metadata in synced folders. Build a
      # fresh bundle so codesign never has to replace a contaminated signature.
      - test -n "{{.BIN_DIR}}" && rm -rf -- "{{.BUNDLE}}"
      - mkdir -p "{{.BUNDLE}}/Contents/MacOS"
      - mkdir -p "{{.BUNDLE}}/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BUNDLE}}/Contents/Resources"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.BUNDLE}}/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BUNDLE}}/Contents/MacOS"
      - cp build/darwin/Info.plist "{{.BUNDLE}}/Contents"
      - task: bundle:libmpv
      - task: '{{if eq OS "darwin"}}codesign{{else}}codesign:skip{{end}}'

  bundle:libmpv:
    summary: Copies our libmpv into the bundle (#92)
    internal: true
    platforms: [darwin]
    # Our LGPL build (build/libmpv) links as @rpath/libmpv.2.dylib: it goes in
    # Contents/Frameworks, and the binary's rpath moves there from the build
    # directory that mpv.pc gave it. Any other libmpv (Homebrew's) still runs
    # locally, but the bundle can't ship (ADR-0003).
    cmds:
      - |
        app="{{.BUNDLE}}/Contents"
        exe="$app/MacOS/{{.APP_NAME}}"
        lib=$(otool -L "$exe" | awk '/libmpv/ { print $1 }')
        case $lib in
        @rpath/*)
          dir=$(pkg-config --variable=libdir mpv)
          mkdir -p "$app/Frameworks"
          cp "$dir/${lib#@rpath/}" "$app/Frameworks/"
          install_name_tool -delete_rpath "$dir" "$exe" 2>/dev/null || true
          install_name_tool -add_rpath @executable_path/../Frameworks "$exe"
          ;;
        *)
          echo "warning: {{.APP_NAME}} links $lib, not Peli's own libmpv (#92): this bundle can't ship"
          ;;
        esac

  codesign:
    summary: Signs the bundle with the hardened runtime (macOS only)
    internal: true
    # Ad hoc unless PELI_SIGN_IDENTITY names a Developer ID (#78), so a local
    # package runs under the same runtime restrictions as a release.
    cmds:
      - build/darwin/dist.sh sign "{{.BUNDLE}}"

  codesign:skip:
    summary: Skips codesigning when cross-compiling
    internal: true
    cmds:
      - 'echo "Skipping codesign (not available on {{OS}}). Sign the .app on macOS before distribution."'

  run:
    cmds:
      - wails3 tool prepare-macos-output --dir "{{.BIN_DIR}}"
      - test -n "{{.BIN_DIR}}" && test -n "{{.APP_NAME}}" && rm -rf -- "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - cp "build/darwin/Info.dev.plist" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist"
      - xattr -cr "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - codesign --verify --deep --strict "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}"'
