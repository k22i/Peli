<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- Peli's mark inside the Icon Composer bundle (macOS 26). Same shapes as
     appicon.svg, drawn at 12.6 units/px instead of 9.6 so the bird fills the tile
     the way appicon.png does, and rebuilt out of what Icon Composer can render:
     flat fills, gradients and clip paths, but no SVG filters. The cream gradient of
     appicon.png's "cream" gradient replaces its flat fill, its "shine" filter is the
     clipped radial below, and its "shade" filter is two offset copies of the bird
     under the body, which leave a warm rim along the bottom edge. -->
<defs>
 <linearGradient id="cream" gradientUnits="userSpaceOnUse" x1="14" y1="6" x2="52" y2="56">
  <stop offset="0" stop-color="#fffdf8"/><stop offset=".5" stop-color="#fff4e0"/><stop offset="1" stop-color="#ffe8c6"/>
 </linearGradient>
 <radialGradient id="shine" gradientUnits="userSpaceOnUse" cx="20" cy="11" r="22">
  <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".6" stop-color="#fff" stop-opacity=".12"/>
  <stop offset="1" stop-color="#fff" stop-opacity="0"/>
 </radialGradient>
 <clipPath id="body"><path d="M11 24V47Q11 55 18.5 52.4L53 38.6C57.6 36.8 59.6 33.4 57.6 30.4C56.6 28.8 55 28.2 53 27.4L30 14Z"/><circle cx="22.5" cy="18.5" r="11.5"/><circle cx="11.2" cy="27" r="4.2"/><circle cx="11.2" cy="34.5" r="4"/><circle cx="11.2" cy="42" r="3.6"/><path d="M14 11.5C9 9.5 6.5 12.5 7 16C9 14 11.5 14 13 15.5Z"/><path d="M17 8.4C14 4.5 9.6 5.2 8.6 8.4C11.2 7.6 13.6 8.6 14.6 10.6Z"/></clipPath>
</defs>
<g transform="translate(512 520) scale(12.6) translate(-31.6 -29.5)">
 <g fill="#f0cba4" opacity=".55"><g transform="translate(0 -1.5)"><path d="M11 24V47Q11 55 18.5 52.4L53 38.6C57.6 36.8 59.6 33.4 57.6 30.4C56.6 28.8 55 28.2 53 27.4L30 14Z"/><circle cx="22.5" cy="18.5" r="11.5"/><circle cx="11.2" cy="27" r="4.2"/><circle cx="11.2" cy="34.5" r="4"/><circle cx="11.2" cy="42" r="3.6"/><path d="M14 11.5C9 9.5 6.5 12.5 7 16C9 14 11.5 14 13 15.5Z"/><path d="M17 8.4C14 4.5 9.6 5.2 8.6 8.4C11.2 7.6 13.6 8.6 14.6 10.6Z"/></g><g transform="translate(0 -.6)"><path d="M11 24V47Q11 55 18.5 52.4L53 38.6C57.6 36.8 59.6 33.4 57.6 30.4C56.6 28.8 55 28.2 53 27.4L30 14Z"/><circle cx="22.5" cy="18.5" r="11.5"/><circle cx="11.2" cy="27" r="4.2"/><circle cx="11.2" cy="34.5" r="4"/><circle cx="11.2" cy="42" r="3.6"/><path d="M14 11.5C9 9.5 6.5 12.5 7 16C9 14 11.5 14 13 15.5Z"/><path d="M17 8.4C14 4.5 9.6 5.2 8.6 8.4C11.2 7.6 13.6 8.6 14.6 10.6Z"/></g></g>
 <g fill="url(#cream)"><path d="M11 24V47Q11 55 18.5 52.4L53 38.6C57.6 36.8 59.6 33.4 57.6 30.4C56.6 28.8 55 28.2 53 27.4L30 14Z"/><circle cx="22.5" cy="18.5" r="11.5"/><circle cx="11.2" cy="27" r="4.2"/><circle cx="11.2" cy="34.5" r="4"/><circle cx="11.2" cy="42" r="3.6"/><path d="M14 11.5C9 9.5 6.5 12.5 7 16C9 14 11.5 14 13 15.5Z"/><path d="M17 8.4C14 4.5 9.6 5.2 8.6 8.4C11.2 7.6 13.6 8.6 14.6 10.6Z"/></g>
 <g clip-path="url(#body)"><rect width="64" height="64" fill="url(#shine)"/></g>
</g>
</svg>
